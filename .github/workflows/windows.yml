name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      # Use the Visual Studio generator explicitly.  GitHub's Windows image also
      # has MinGW on PATH; with Ninja CMake may otherwise pick g++ and then try
      # to link it against the MSVC build of Qt, which is an invalid toolchain mix.
      - name: Configure (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: ./scripts/package_windows.ps1 -BuildDir build/Release -OutDir dist/ArenaTES3JSON

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaTES3JSON-windows-x64
          path: dist/ArenaTES3JSON-windows-x64.zip
