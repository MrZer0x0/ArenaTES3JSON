name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Rust versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Test semantic backend
        run: cargo test --manifest-path core-rs/Cargo.toml

      - name: Configure Qt frontend (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test complete build
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: ./scripts/package_windows.ps1 -BuildDir build/Release -OutDir dist/ArenaTES3JSON

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaTES3JSON-windows-x64
          path: dist/ArenaTES3JSON-windows-x64.zip
