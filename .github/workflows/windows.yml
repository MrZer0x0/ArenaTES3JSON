name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Test semantic backend
        run: cargo test --manifest-path core-rs/Cargo.toml

      - name: Configure Qt frontend (MSVC x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test complete build
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package one portable EXE
        shell: pwsh
        run: ./scripts/package_windows.ps1 -BuildDir build/Release -OutFile dist/ArenaTES3JSON.exe

      - name: Verify one-file package
        shell: pwsh
        run: ./scripts/verify_onefile.ps1 -DistDir dist -ExeName ArenaTES3JSON.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ArenaTES3JSON-windows-x64
          path: dist/ArenaTES3JSON.exe
          if-no-files-found: error
