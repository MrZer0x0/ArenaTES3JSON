[package]
name = "arenates3json-core"
version = "0.3.2"
edition = "2021"
license = "MIT"

[[bin]]
name = "ArenaTES3JSON-core"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }

# Pinned to the same TES3 object model used by the supplied tes3conv GUI.
# This gives ArenaTES3JSON the same semantic JSON structure.
# Nightly/SIMD features stay disabled so current stable Rust builds reliably.
[dependencies.tes3]
git = "https://github.com/Greatness7/tes3"
rev = "95cbc2cad2c574b023da879e308d3f6f6c4c3e04"
default-features = false
features = ["esp", "serde"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
